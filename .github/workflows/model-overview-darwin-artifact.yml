name: Unified Atlas Intel macOS artifact

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/model-overview-darwin-artifact.yml
      - tools/model-overview-darwin-artifact.py

permissions:
  contents: read

jobs:
  darwin-artifact:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_BUILD_JOBS: '2'
      HOUSEATLAS_EXECUTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      HOUSEATLAS_EXECUTED_WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - name: Prepare isolated Cargo paths
        shell: bash
        run: |
          printf 'CARGO_HOME=%s/model-overview-cargo\nCARGO_TARGET_DIR=%s/model-overview-target\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out reviewed build recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: recipe
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Check out the workflow revision GitHub executed
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: executed-workflow
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Check out immutable public product source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 5f6456ae3d7bd90854ee369fcff82512a5007d55
          path: source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Install exact Rust compiler and target
        run: rustup toolchain install 1.99.0 --profile minimal --target x86_64-apple-darwin
      - name: Build pinned source and inspect Intel macOS ABI
        run: >-
          python3 recipe/tools/model-overview-darwin-artifact.py
          --source source --recipe recipe --workflow-source executed-workflow
          --output "$RUNNER_TEMP/model-overview-artifact"
      - name: Upload binary archive and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: houseatlas-unified-atlas-x86_64-apple-darwin
          path: ${{ runner.temp }}/model-overview-artifact/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
