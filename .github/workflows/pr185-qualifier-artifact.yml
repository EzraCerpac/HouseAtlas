name: PR185 Intel macOS external qualifier artifact

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr185-qualifier-artifact.yml
      - tools/pr185-qualifier-artifact.py
      - tools/pr185-full-qualifier.rs

permissions:
  contents: read

jobs:
  qualifier-artifact:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Prepare isolated Cargo paths
        shell: bash
        run: |
          printf 'CARGO_HOME=%s/pr185-qualifier-cargo\nCARGO_TARGET_DIR=%s/pr185-qualifier-target\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out exact qualifier recipe head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: recipe
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Check out immutable public product library source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: e8fe7494068c83b3623d03b41bef29549ef9f703
          path: source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Install exact Rust compiler and target
        run: rustup toolchain install 1.99.0 --profile minimal --target x86_64-apple-darwin
      - name: Build external qualifier and named synthetic self-check
        run: >-
          python3 recipe/tools/pr185-qualifier-artifact.py
          --source source --recipe recipe
          --output "$RUNNER_TEMP/pr185-qualifier-artifact"
      - name: Upload qualifier archive and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: houseatlas-pr185-full-qualifier-x86_64-apple-darwin
          path: ${{ runner.temp }}/pr185-qualifier-artifact/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
