name: Rust React ordinary core
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
# Cancel superseded candidates for one PR; every main/release event keeps its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Set exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
          check-latest: false
          package-manager-cache: false
      - name: Verify revision and runtime
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node --version)" = "v26.10.0"
          test "$(npm --version)" = "11.19.1"
          printf 'CARGO_TARGET_DIR=%s/houseatlas-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          test "$(rustc --version | cut -d ' ' -f 2)" = "1.99.0"
      - name: Set isolated npm content cache
        run: printf 'npm_config_cache=%s/houseatlas-npm\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Cache public package content only, never node_modules, npm logs or credentials.
      # PRs restore exact keys; only successful main pushes may publish caches.
      - name: Restore exact npm content cache
        id: npm-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/houseatlas-npm/_cacache
          key: npm-v1-${{ matrix.os }}-${{ runner.arch }}-node-26.10.0-npm-11.19.1-${{ hashFiles('package-lock.json', 'packages/contracts/package-lock.json', 'frontend/package-lock.json') }}
      # No broad restore keys: registry and compiled outputs are lock/toolchain/OS specific.
      - name: Restore exact Cargo registry cache
        id: cargo-registry-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: cargo-registry-v1-${{ matrix.os }}-${{ runner.arch }}-rust-1.99.0-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/**') }}
      # Compiled outputs also pin source, embedded schemas/fixtures and build configuration.
      # Disposable runtime state is created outside this build directory and never cached.
      - name: Restore exact Cargo build cache
        id: cargo-target-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/houseatlas-target
          key: cargo-target-v1-${{ matrix.os }}-${{ runner.arch }}-rust-1.99.0-no-incremental-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ hashFiles('.github/workflows/rust-react-ordinary.yml', 'tools/rust-integration/check-source.mjs', 'Cargo.toml', '.cargo/**', 'backend/**', 'tools/rust-baseline/**', 'tools/rust-integration/examples/**', 'packages/contracts/**', 'contracts/**', 'adapters/homebox/fixtures/**', 'adapters/network/fixtures/**') }}
      - name: Install exact npm locks without scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix packages/contracts --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Verify source allowlist and unconfigured template
        run: npm run verify:publication
      - name: Compile actual Rust and React source and named healthy examples
        run: node tools/rust-integration/check-source.mjs
      - name: Genuine native MCP stock get and audit page after fresh circuit commit
        if: runner.os == 'Linux'
        run: cargo run --locked -p houseatlas-backend --example healthy-agent-stock
      - name: Real disposable loopback TLS browser read slice
        if: runner.os == 'Linux'
        env:
          HOUSEATLAS_BINARY: ${{ runner.temp }}/houseatlas-target/debug/houseatlas
          HOUSEATLAS_CHROMIUM: /usr/bin/google-chrome
        run: node tools/rust-integration/healthy-loopback.mjs
      - name: Real disposable auth reads and fresh local writes
        if: runner.os == 'Linux'
        env:
          HOUSEATLAS_BINARY: ${{ runner.temp }}/houseatlas-target/debug/houseatlas
          HOUSEATLAS_CHROMIUM: /usr/bin/google-chrome
        run: node tools/rust-integration/healthy-core-loopback.mjs
      - name: Real disposable owned media commits and GET HEAD delivery
        if: runner.os == 'Linux'
        env:
          HOUSEATLAS_BINARY: ${{ runner.temp }}/houseatlas-target/debug/houseatlas
          HOUSEATLAS_CHROMIUM: /usr/bin/google-chrome
        run: node tools/rust-integration/healthy-media-loopback.mjs
      - name: Real disposable native stock circuit and asset reads
        if: runner.os == 'Linux'
        env:
          HOUSEATLAS_BINARY: ${{ runner.temp }}/houseatlas-target/debug/houseatlas
          HOUSEATLAS_CHROMIUM: /usr/bin/google-chrome
        run: node tools/rust-integration/healthy-stock-loopback.mjs
      - name: Real disposable fresh stock circuit and atomic identity batch
        if: runner.os == 'Linux'
        env:
          HOUSEATLAS_BINARY: ${{ runner.temp }}/houseatlas-target/debug/houseatlas
          HOUSEATLAS_CHROMIUM: /usr/bin/google-chrome
        run: node tools/rust-integration/healthy-stock-write-loopback.mjs
      - name: Real disposable native stock audit first pages and search
        if: runner.os == 'Linux'
        env:
          HOUSEATLAS_BINARY: ${{ runner.temp }}/houseatlas-target/debug/houseatlas
          HOUSEATLAS_CHROMIUM: /usr/bin/google-chrome
        run: node tools/rust-integration/healthy-stock-history-loopback.mjs
      - name: Real native browser WebMCP stock read fresh create and audit page
        if: runner.os == 'Linux'
        env:
          HOUSEATLAS_BINARY: ${{ runner.temp }}/houseatlas-target/debug/houseatlas
          HOUSEATLAS_CHROMIUM: /usr/bin/google-chrome
        run: node tools/rust-integration/healthy-agent-loopback.mjs
      - name: Real cached HomeBox read native WebMCP classification and mounted MCP audit
        if: runner.os == 'Linux'
        env:
          HOUSEATLAS_BINARY: ${{ runner.temp }}/houseatlas-target/debug/houseatlas
          HOUSEATLAS_CHROMIUM: /usr/bin/google-chrome
        run: node tools/rust-integration/healthy-agent-host-loopback.mjs
      - name: Real React human classification cached read and mounted MCP audit
        if: runner.os == 'Linux'
        env:
          HOUSEATLAS_BINARY: ${{ runner.temp }}/houseatlas-target/debug/houseatlas
          HOUSEATLAS_CHROMIUM: /usr/bin/google-chrome
        run: node tools/rust-integration/healthy-human-host-loopback.mjs
      - name: Real React fresh attachment and existing-original reuse
        if: runner.os == 'Linux'
        env:
          HOUSEATLAS_BINARY: ${{ runner.temp }}/houseatlas-target/debug/houseatlas
          HOUSEATLAS_CHROMIUM: /usr/bin/google-chrome
        run: node tools/rust-integration/healthy-upload-loopback.mjs
      - name: Real cached Unicode collection read with complete SQLite facts
        if: runner.os == 'Linux'
        env:
          HOUSEATLAS_BINARY: ${{ runner.temp }}/houseatlas-target/debug/houseatlas
          HOUSEATLAS_CHROMIUM: /usr/bin/google-chrome
        run: node tools/rust-integration/healthy-homebox-cache-unicode-loopback.mjs
      - name: Save npm content cache from verified main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/houseatlas-npm/_cacache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Save Cargo registry cache from verified main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-registry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: ${{ steps.cargo-registry-cache.outputs.cache-primary-key }}
      - name: Save Cargo build cache from verified main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/houseatlas-target
          key: ${{ steps.cargo-target-cache.outputs.cache-primary-key }}
      - name: Record scope
        # Stock read/write/history runners add four/ten/three healthy requests respectively.
        if: always()
        run: |
          printf '%s\n' 'Actual locked Rust/TS source compilation and four named healthy examples; Linux additionally runs the explicitly named genuine in-process MCP stock get/history after a fresh native circuit commit, actual SQLite/access/domain/React loopback TLS reads, session/login/logout, fresh circuit create, atomic local identity batch, fresh owned PNG/text commits, actual download GET/HEAD and safe-rendered PNG preview; genuine native stock circuit/asset reads compared with actual frozen SQLite rows.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The separately named upload runner submits two fresh React attachment intents for one generated PNG, verifies the existing-original plan and unchanged original provenance, exact asset revision guard, canonical receipts and actual SQLite rows, with one original consumption and zero pending stages. It is not replay, fault or cleanup-failure qualification.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'macOS source compilation is separate from target NAS build/runtime qualification and supplies no target release.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'All stopped rejection, guards, replay, expiry, revocation, fault, crash, concurrency and provider controls remain unrun.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The separate host runner performs one authorized cached HomeBox read with the original full projections, dates and generation preserved; one fresh native WebMCP location classification replacement with full references and canonical React completion; actual record/admission readback; mounted MCP HTTP initialization/discovery/get/first audit page; and read-only SQLite reason observation. It does not submit the human form.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The separately named human host runner uses a fresh disposable fixture and one actual React classification form submission through the real editing HTTP port. It preserves HomeBox canEdit=false, the full short reason, original source/evidence/identity references and guards, then checks canonical receipt retention through view refresh and genuine native/MCP readback. Upload, provider refresh/network I/O and populated recovery runtime remain outside both host flows.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The named stock write runner adds only fresh local circuit create and an ordered identity-create batch through the actual original AT11 fence and native atomic stock journal, with frozen record/history readback and read-only durable journal counts.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The named stock history runner adds three first-page/search reads over genuine stock-owned audits; nonnull cursor continuation is not demonstrated.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The named native WebMCP runner uses actual document.modelContext discovery and invocation, genuine stock identity get, fresh circuit create, record readback and first audit page, with canonical results committed to React before tool return. No modelContext or stock service stub is installed.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The separately named Unicode cache runner uses the fixed public opaque-collection profile, actual Viewer authority and one cached-only query GET. It compares both complete projections and original cache metadata with read-only SQLite source/cache/projection rows. No HTTP authentication mutation, editing, MCP, old-path comparison or provider I/O runs in that flow.' >> "$GITHUB_STEP_SUMMARY"
