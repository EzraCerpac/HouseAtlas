name: PR185 Intel macOS artifact

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr185-darwin-artifact.yml
      - tools/pr185-darwin-artifact.py

permissions:
  contents: read

jobs:
  darwin-artifact:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_HOME: ${{ runner.temp }}/pr185-cargo
      CARGO_TARGET_DIR: ${{ runner.temp }}/pr185-target
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Check out reviewed build recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: recipe
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Check out immutable public product source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: e8fe7494068c83b3623d03b41bef29549ef9f703
          path: source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Install exact Rust compiler and target
        run: rustup toolchain install 1.99.0 --profile minimal --target x86_64-apple-darwin
      - name: Build pinned source and inspect Intel macOS ABI
        run: >-
          python3 recipe/tools/pr185-darwin-artifact.py
          --source source --recipe recipe
          --output "$RUNNER_TEMP/pr185-artifact"
      - name: Upload binary archive and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: houseatlas-pr185-x86_64-apple-darwin
          path: ${{ runner.temp }}/pr185-artifact/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
