name: Ordinary synthetic core
on:
  push:
    branches: [main]
  # Every non-conflicted PR runs, including stacked PRs whose base is another branch
  # (GitHub starts no pull_request run while a PR conflicts with its base); pushes run on main only.
  pull_request:
permissions:
  contents: read
# Cancel superseded candidates for one PR; every main/release event keeps its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ordinary-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Synthetic PR selector regressions (stdlib and disposable Git histories)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Check the CI command manifest against these workflows (stdlib, repository files only)
        run: python3 -B -I tools/ci/check_lanes.py --check
      - name: Set exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
          check-latest: false
          package-manager-cache: false
      - name: Verify runtime and revision
        run: |
          test "$(node --version)" = "v26.10.0"
          test "$(npm --version)" = "11.19.1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set isolated npm content cache
        run: printf 'npm_config_cache=%s/houseatlas-npm\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Cache public package content only, never node_modules, npm logs or credentials.
      # PRs restore exact keys; only successful main pushes may publish caches.
      - name: Restore exact npm content cache
        id: npm-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/houseatlas-npm/_cacache
          key: npm-v1-ubuntu-24.04-${{ runner.arch }}-node-26.10.0-npm-11.19.1-${{ hashFiles('package-lock.json', 'packages/contracts/package-lock.json') }}
      - name: Install exact locks without scripts or audit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix packages/contracts --ignore-scripts --no-audit --no-fund
      - name: Verify publication file set and template
        run: npm run verify:publication
      - name: Run the twelve synthetic publication manifest regenerator cases
        run: node --test --test-concurrency=1 tools/publication/refresh-manifest.test.mjs
      - name: Build six ordinary modules
        run: npm run build:ordinary
      - name: Check additive HTTP history schema and valid examples
        run: |
          node --check packages/contracts/history/check-history.mjs
          npm run check:http:ordinary
      - name: Run one healthy synthetic Request group
        run: npm run test:ordinary
      - name: Run the eight synthetic electrical registration cases
        run: node --test --test-concurrency=1 tools/electrical_registration/healthy.test.mjs
      - name: Check synthetic host-client options, identities, pacing, MCP and comparison (no host or load)
        run: node --test --test-concurrency=1 tools/perf/host-client/options.test.mjs tools/perf/host-client/compare.test.mjs
      - name: Run synthetic Cargo mode argument-routing regressions
        run: node --test --test-concurrency=1 tools/cargo-modes/run.test.mjs
      - name: Check the NAS deploy tool with a fake service
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/deploy-nas -p 'test_*.py'
      - name: Check the nightly backup script with a fake service and iCloud helper
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/backup -p 'test_*.py'
      # Stdlib-only synthetic tests; the runner's python3, not the pinned 3.14.8.
      - name: Check synthetic publication-input disposition claims (in memory only)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/model-input-disposition -p test_disposition.py -v
      - name: Check prospective storage adapter v2 (synthetic injected ports only)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/model-input-disposition -p test_storage_adapter.py -v
      - name: Check descriptor-backed present observations (disposable files only)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/model-input-disposition -p test_storage_owner_ports.py -v
      - name: Run the HomeBox quantity seed report's synthetic unit tests
        run: |
          python3 --version
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/homebox-quantity-seed-report -p test_report.py -v
      - name: Run the sixteen synthetic runtime profiling guard and receipt cases
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python >=3.11 required"; print(sys.version)'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/perf/runtime-profile -p test_runtime_profile.py -v
      # Owner-approved finite exception: fake GET owners and disposable journal only.
      - name: Run the three scoped synthetic bridge read cases
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tools/houseatlas-mcp-bridge/test_bridge.py healthy_large_read_page
          PYTHONDONTWRITEBYTECODE=1 python3 tools/houseatlas-mcp-bridge/test_bridge.py denial_read_profile_bounds
          PYTHONDONTWRITEBYTECODE=1 python3 tools/houseatlas-mcp-bridge/test_bridge.py denial_read_correlation
      - name: Save npm content cache from verified main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/houseatlas-npm/_cacache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Record coverage boundary
        if: always()
        run: |
          printf '%s\n' 'Scope: synthetic publication-input disposition claim parsing/reconciliation/formatting (29 pure, 75 adapter in-memory and 46 disposable filesystem observation cases only), stdlib selector and CI command-manifest checks, synthetic deploy-nas and backup tool tests, the three explicit synthetic bridge read cases (healthy_large_read_page, denial_read_profile_bounds, denial_read_correlation; fake GET/session/admission owners and disposable journal only), integrity, syntax, six module builds, 14 history checks, one healthy synthetic mutation/read/history/DTO Request group, the HomeBox quantity seed report unit tests, eight named synthetic electrical registration cases, sixteen synthetic runtime profiling guard/receipt cases, the explicit Cargo mode process-routing regressions, twelve synthetic publication manifest regenerator cases (temporary trees only) and nine host-client options, driver-identity, pacing, MCP and comparison cases (two exact Node files; generated temp files and fake ports only, no host or load).' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Command outcomes are reported in the steps above; this summary alone is not a pass claim.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'New explicit source-presence admission is blocked and unexercised.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Beyond the eight named electrical cases and the three exact scoped bridge read cases, guard reversal, mutation/omission controls, adversarial, denial, failure injection, concurrency and private-intake checks remain stopped and excluded.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'No provider, target, secret recovery, HTTPS, pilot, deployment, full security or production qualification.' >> "$GITHUB_STEP_SUMMARY"

