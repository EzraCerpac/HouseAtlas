name: Ordinary synthetic core
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
permissions:
  contents: read
# Cancel superseded candidates for one PR; every main/release event keeps its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ordinary-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Set exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
          check-latest: false
          package-manager-cache: false
      - name: Verify runtime and revision
        run: |
          test "$(node --version)" = "v26.10.0"
          test "$(npm --version)" = "11.19.1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set isolated npm content cache
        run: printf 'npm_config_cache=%s/houseatlas-npm\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Cache public package content only, never node_modules, npm logs or credentials.
      # PRs restore exact keys; only successful main pushes may publish caches.
      - name: Restore exact npm content cache
        id: npm-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/houseatlas-npm/_cacache
          key: npm-v1-ubuntu-24.04-${{ runner.arch }}-node-26.10.0-npm-11.19.1-${{ hashFiles('package-lock.json', 'packages/contracts/package-lock.json') }}
      - name: Install exact locks without scripts or audit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix packages/contracts --ignore-scripts --no-audit --no-fund
      - name: Verify publication file set and template
        run: npm run verify:publication
      - name: Build six ordinary modules
        run: npm run build:ordinary
      - name: Check additive HTTP history schema and valid examples
        run: |
          node --check packages/contracts/history/check-history.mjs
          npm run check:http:ordinary
      - name: Run one healthy synthetic Request group
        run: npm run test:ordinary
      - name: Save npm content cache from verified main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/houseatlas-npm/_cacache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Record coverage boundary
        if: always()
        run: |
          printf '%s\n' 'Scope: integrity, syntax, six module builds, 14 history checks and one healthy synthetic mutation/read/history/DTO Request group.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Command outcomes are reported in the steps above; this summary alone is not a pass claim.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'New explicit source-presence admission is blocked and unexercised.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Guard reversal, mutation/omission controls, adversarial, denial, failure injection, concurrency and private-intake checks remain stopped and excluded.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'No provider, target, secret recovery, HTTPS, pilot, deployment, full security or production qualification.' >> "$GITHUB_STEP_SUMMARY"
