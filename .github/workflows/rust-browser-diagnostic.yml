name: Blank Chrome pipe startup diagnostic
on:
  push:
    branches: [codex/rust-browser-diagnostic]
permissions:
  contents: read
jobs:
  blank-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Set exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
          check-latest: false
          package-manager-cache: false
      - name: Verify revision runtime and publication integrity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node --version)" = "v26.10.0"
          test "$(npm --version)" = "11.19.1"
          npm run verify:publication
      - name: Observe blank Chrome version stderr and CDP pipe
        env:
          HOUSEATLAS_CHROMIUM: /usr/bin/google-chrome
        run: node tools/rust-integration/blank-chrome-diagnostic.mjs
