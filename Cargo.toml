[workspace]
members = ["backend"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false

[workspace.dependencies]
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "multipart", "original-uri", "query", "tokio"] }
tokio = { version = "=1.53.2", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "float_roundtrip", "raw_value"] }
jsonschema = { version = "=0.58.6", default-features = false, features = ["arbitrary-precision"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
base64 = "=0.22.1"
getrandom = "=0.3.4"
scrypt = { version = "=0.11.0", default-features = false }
sha2 = "=0.10.9"
subtle = "=2.6.1"
url = "=2.5.7"
percent-encoding = "=2.3.2"
time = { version = "=0.3.44", features = ["parsing", "formatting"] }
serde_jcs = "=0.2.0"
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls"] }
ryu-js = "=1.0.2"
regex = "=1.13.1"
uuid = { version = "=1.18.1", features = ["serde"] }
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
fluent-uri = { version = "=0.4.1", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
crc32fast = "=1.5.0"
png = "=0.18.1"
rustix = { version = "=1.1.2", features = ["fs", "process"] }
tempfile = "=3.23.0"
ring = { version = "=0.17.14", default-features = false, features = ["alloc", "std"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }

[workspace.lints.rust]
unsafe_code = "forbid"
